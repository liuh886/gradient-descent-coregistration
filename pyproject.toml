[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-descent-coregistration"
version = "0.1.0"
description = "A point-to-surface DEM coregistration and quality control library using gradient descent & pattern search"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Zhihao Liu" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.2",
    "geopandas>=0.10",
    "shapely>=1.8",
]
xarray = [
    "xarray>=0.20",
    "rioxarray>=0.10",
]
all = [
    "gradient-descent-coregistration[geo,xarray]",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "rasterio>=1.2",
    "geopandas>=0.10",
    "shapely>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
